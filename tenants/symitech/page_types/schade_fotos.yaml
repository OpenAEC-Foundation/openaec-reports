# Symitech BIC Rapportage — 8.3 Herstelwerkzaamheden schade foto's (portrait)
# Layout: context header + schadenummer + dubbele foto's (schade/herstel)
# Pagina: A4 portrait 595.3×841.9pt (210×297mm)

name: schade_fotos
stationery: content_portrait_stationery.pdf

text_zones:
  # === Sub-heading ===
  - bind: _static.8.3
    x_mm: 17.6
    y_mm: 31.5
    font: heading
    size: 12
    color: "primary"

  - bind: _static.Herstelwerkzaamheden ondersteunende schade foto's
    x_mm: 27.7
    y_mm: 31.5
    font: heading
    size: 12
    color: "primary"

  # Context regel 1: BICCODE: OBJECTTYPE VOORZIENINGOMSCHRIJVING
  - bind: schade_fotos.context_1
    x_mm: 17.6
    y_mm: 35.7
    font: body
    size: 10
    color: "text"
    max_width_mm: 170

  # Context regel 2: SCHADENUMMER: ONDERDEEL HERSTELDATUM
  - bind: schade_fotos.context_2
    x_mm: 17.6
    y_mm: 39.8
    font: body
    size: 10
    color: "text"
    max_width_mm: 170

  # === Schade foto (links) ===
  - bind: schade_fotos.schade_label
    x_mm: 19.5
    y_mm: 44.0
    font: body
    size: 8
    color: "text"

  - bind: schade_fotos.schade_caption
    x_mm: 19.5
    y_mm: 47.0
    font: body
    size: 8
    color: "text"

  # === Herstel foto (rechts) ===
  - bind: schade_fotos.herstel_label
    x_mm: 114.4
    y_mm: 44.0
    font: body
    size: 8
    color: "text"

  - bind: schade_fotos.herstel_caption
    x_mm: 114.4
    y_mm: 47.0
    font: body
    size: 8
    color: "text"

  # === Footer ===
  - bind: client.name
    x_mm: 10.0
    y_mm: 275.1
    font: heading
    size: 10
    color: "white"

  - bind: _page_number
    x_mm: 135.6
    y_mm: 277.3
    font: heading
    size: 12
    color: "white"
    align: right

  - bind: meta.rapportkop_locatie
    x_mm: 10.0
    y_mm: 283.2
    font: heading
    size: 10
    color: "white"

image_zones:
  # Schade foto (links)
  - bind: schade_fotos.schade_foto
    x_mm: 19.5
    y_mm: 50.0
    width_mm: 90
    height_mm: 200
    fallback: ""

  # Herstel foto (rechts)
  - bind: schade_fotos.herstel_foto
    x_mm: 114.4
    y_mm: 50.0
    width_mm: 90
    height_mm: 200
    fallback: ""
