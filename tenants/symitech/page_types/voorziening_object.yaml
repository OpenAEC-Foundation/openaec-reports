# Symitech BIC Rapportage — Voorziening + Object details (pagina 4)
# Pixel-exact gemeten uit 336.01-BIC Rapportage.pdf
# Pagina: A4 portrait 595.3×841.9pt (210×297mm)
#
# Layout: twee hoofdstukken op 1 pagina
#   "2 Voorziening" — details + VVV
#   "3 Object" — details + foto
# Labels: x0=55.2pt (19.5mm), heading, secondary
# Waarden: x0=374.4pt (132.1mm), body, text
# Dubbele lijnen: (49.7→227.2pt) = (17.5→80.2mm)

name: voorziening_object
stationery: content_portrait_stationery.pdf

line_zones:
  # --- Sectie "Voorziening details" dubbele lijn ---
  - x0_mm: 17.5
    y_mm: 42.05
    x1_mm: 80.2
    width_pt: 0.75
    color: "primary"
  - x0_mm: 17.5
    y_mm: 42.95
    x1_mm: 80.2
    width_pt: 3.0
    color: "primary"

  # --- Sectie "Object details" dubbele lijn ---
  - x0_mm: 17.5
    y_mm: 88.55
    x1_mm: 80.2
    width_pt: 0.75
    color: "primary"
  - x0_mm: 17.5
    y_mm: 89.45
    x1_mm: 80.2
    width_pt: 3.0
    color: "primary"

  # --- Sectie "VVV" dubbele lijn ---
  - x0_mm: 17.5
    y_mm: 118.55
    x1_mm: 80.2
    width_pt: 0.75
    color: "primary"
  - x0_mm: 17.5
    y_mm: 119.45
    x1_mm: 80.2
    width_pt: 3.0
    color: "primary"

