# Symitech BIC Rapportage — tekening/afbeelding pagina (portrait)
# Herbruikbaar voor: Tekeningen (p7-9), Bijlage VVV (p14)
# Pagina: A4 portrait 595.3×841.9pt (210×297mm)
#
# Layout: hoofdstuk heading + sub-heading + afbeelding placeholder
# Coördinaten gemeten uit 336.01-BIC Rapportage.pdf

name: tekening_pagina
stationery: content_portrait_stationery.pdf

text_zones:
  # === Hoofdstuk heading ===
  # ref: x0=49.8pt y0=91.2pt  14pt Arial-BoldMT #006fab
  - bind: heading.number
    x_mm: 17.6
    y_mm: 32.2
    font: heading
    size: 14
    color: "primary"

  # ref: x0=71.3pt y0=91.2pt  14pt Arial-BoldMT #006fab
  - bind: heading.title
    x_mm: 25.2
    y_mm: 32.2
    font: heading
    size: 14
    color: "primary"

  # === Sub-heading ===
  # ref: x0=49.8pt y0=111.4pt  12pt Arial-BoldMT #006fab
  - bind: subheading.number
    x_mm: 17.6
    y_mm: 39.3
    font: heading
    size: 12
    color: "primary"

  # ref: x0=78.6pt y0=111.4pt  12pt Arial-BoldMT #006fab
  - bind: subheading.title
    x_mm: 27.7
    y_mm: 39.3
    font: heading
    size: 12
    color: "primary"

  # === Footer ===
  - bind: client.name
    x_mm: 10.3
    y_mm: 275.4
    font: heading
    size: 10
    color: "white"

  - bind: _page_number
    x_mm: 137.5
    y_mm: 277.3
    font: heading
    size: 12
    color: "white"
    align: right

  - bind: meta.rapportkop_locatie
    x_mm: 10.3
    y_mm: 283.5
    font: heading
    size: 10
    color: "white"

# Afbeelding placeholder
image_zones:
  - bind: tekening.image
    x_mm: 17.6
    y_mm: 43.5
    width_mm: 170
    height_mm: 220
    fallback: ""
