# Symitech BIC Rapportage — Controlelijst BIC (pagina 10, landscape)
# Pixel-exact gemeten uit 336.01-BIC Rapportage.pdf
# Pagina: A4 landscape 841.9×595.3pt (297×210mm)
#
# Layout: "7 Onderhoudsdossier" heading + "7.1 Controlelijst..."
#   Complexe tabel met multi-rij headers
# Kolommen: Onderdeel, Aspect/Constatering, Antwoord/Maatregel, Bodemrisico, Schadenummer

name: controlelijst_bic
stationery: content_landscape_stationery.pdf

line_zones:
  # --- Dubbele lijn onder headers ---
  - x0_mm: 10.0
    y_mm: 58.5
    x1_mm: 286.1
    width_pt: 3.0
    color: "primary"
  - x0_mm: 10.0
    y_mm: 59.4
    x1_mm: 286.1
    width_pt: 0.75
    color: "primary"

text_zones:
  # === Heading ===
  # ref: "7" x0=28.5pt y0=103.2pt  14pt primary
  - bind: _static.7
    x_mm: 10.1
    y_mm: 36.4
    font: heading
    size: 14
    color: "primary"

  - bind: _static.Onderhoudsdossier
    x_mm: 17.6
    y_mm: 36.4
    font: heading
    size: 14
    color: "primary"

  # Sub-heading
  # ref: "7.1" x0=28.5pt y0=123.4pt  12pt primary
  - bind: _static.7.1
    x_mm: 10.1
    y_mm: 43.5
    font: heading
    size: 12
    color: "primary"

  - bind: _static.Controlelijst bedrijfsinterne controle (BIC)
    x_mm: 20.2
    y_mm: 43.5
    font: heading
    size: 12
    color: "primary"

  # Context info
  # ref: x0=35.5pt y0=135.3pt  10pt secondary
  - bind: controlelijst.context
    x_mm: 12.5
    y_mm: 47.7
    font: body
    size: 10
    color: "secondary"
    max_width_mm: 270

  # === Tabel headers (2 rijen) ===
  # Rij 1: hoofdkoppen
  - bind: _static.Onderdeel
    x_mm: 11.9
    y_mm: 51.8
    font: heading
    size: 10
    color: "secondary"

  - bind: _static.Aspect
    x_mm: 64.4
    y_mm: 51.8
    font: heading
    size: 10
    color: "secondary"

  - bind: _static.Antwoord
    x_mm: 174.5
    y_mm: 51.8
    font: heading
    size: 10
    color: "secondary"

  - bind: _static.Bodemrisico
    x_mm: 199.5
    y_mm: 51.8
    font: heading
    size: 10
    color: "secondary"

  - bind: _static.Schadenummer
    x_mm: 232.0
    y_mm: 51.8
    font: heading
    size: 10
    color: "secondary"

  # Rij 2: subkoppen
  - bind: _static.Constatering
    x_mm: 64.4
    y_mm: 55.9
    font: heading
    size: 10
    color: "secondary"

  - bind: _static.Maatregel
    x_mm: 174.5
    y_mm: 55.9
    font: heading
    size: 10
    color: "secondary"

  # === Footer ===
  - bind: client.name
    x_mm: 10.2
    y_mm: 189.2
    font: heading
    size: 10
    color: "white"

  - bind: _page_number
    x_mm: 252.5
    y_mm: 190.0
    font: heading
    size: 12
    color: "white"
    align: right

  - bind: meta.rapportkop_locatie
    x_mm: 10.2
    y_mm: 197.3
    font: heading
    size: 10
    color: "white"

# Tabel
table:
  data_bind: controlelijst_items
  origin:
    x_mm: 11.9
    y_mm: 58.0
  row_height_mm: 5.6
  max_y_mm: 180
  show_header: false
  body_font: body
  body_size: 8
  body_color: "secondary"
  columns:
    - { field: "Onderdeel", header: "Onderdeel", width_mm: 52, align: left }
    - { field: "Aspect", header: "Aspect/Constatering", width_mm: 110, align: left }
    - { field: "Antwoord", header: "Antwoord/Maatregel", width_mm: 25, align: left }
    - { field: "Bodemrisico", header: "Bodemrisico", width_mm: 32, align: left }
    - { field: "Schadenummer", header: "Schadenummer", width_mm: 50, align: left }
