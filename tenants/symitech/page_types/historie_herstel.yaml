# Symitech BIC Rapportage — Historie herstelwerkzaamheden (pagina 13, landscape)
# Pixel-exact gemeten uit 336.01-BIC Rapportage.pdf
# Pagina: A4 landscape 841.9×595.3pt (297×210mm)
#
# Layout: "7.2.3 Historie herstelwerkzaamheden"
#   Tabel: Uitvoerend bedrijf, Uitvoerder, Onderdeel, Hersteldatum, Schadenummer, Aard

name: historie_herstel
stationery: content_landscape_stationery.pdf

line_zones:
  # --- Dubbele lijn onder headers ---
  - x0_mm: 10.0
    y_mm: 38.5
    x1_mm: 286.1
    width_pt: 3.0
    color: "primary"
  - x0_mm: 10.0
    y_mm: 39.4
    x1_mm: 286.1
    width_pt: 0.75
    color: "primary"

text_zones:
  # === Sub-heading ===
  # ref: "7.2.3" x0=28.5pt y0=87.4pt  10pt primary
  - bind: _static.7.2.3
    x_mm: 10.1
    y_mm: 30.8
    font: heading
    size: 10
    color: "primary"

  - bind: _static.Historie herstelwerkzaamheden
    x_mm: 22.7
    y_mm: 30.8
    font: heading
    size: 10
    color: "primary"

  # === Tabel headers ===
  # ref: y0=98.9pt
  - bind: _static.Uitvoerend bedrijf
    x_mm: 11.9
    y_mm: 34.9
    font: body
    size: 10
    color: "secondary"

  - bind: _static.Uitvoerder
    x_mm: 64.4
    y_mm: 34.9
    font: body
    size: 10
    color: "secondary"

  - bind: _static.Onderdeel
    x_mm: 104.5
    y_mm: 34.9
    font: body
    size: 10
    color: "secondary"

  - bind: _static.Hersteldatum
    x_mm: 133.7
    y_mm: 34.9
    font: body
    size: 10
    color: "secondary"

  - bind: _static.Schadenummer
    x_mm: 164.5
    y_mm: 34.9
    font: body
    size: 10
    color: "secondary"

  - bind: _static.Aard werkzaamheden
    x_mm: 214.6
    y_mm: 34.9
    font: body
    size: 10
    color: "secondary"

  # === Footer ===
  - bind: client.name
    x_mm: 10.2
    y_mm: 189.2
    font: heading
    size: 10
    color: "white"

  - bind: _page_number
    x_mm: 252.5
    y_mm: 190.0
    font: heading
    size: 12
    color: "white"
    align: right

  - bind: meta.rapportkop_locatie
    x_mm: 10.2
    y_mm: 197.3
    font: heading
    size: 10
    color: "white"

# Tabel
table:
  data_bind: historie_herstel_items
  origin:
    x_mm: 11.9
    y_mm: 37.5
  row_height_mm: 5.6
  max_y_mm: 180
  show_header: false
  body_font: body
  body_size: 8
  body_color: "text"
  columns:
    - { field: "Uitvoerend bedrijf", header: "Uitvoerend bedrijf", width_mm: 52, align: left }
    - { field: "Uitvoerder", header: "Uitvoerder", width_mm: 40, align: left }
    - { field: "Onderdeel", header: "Onderdeel", width_mm: 29, align: left }
    - { field: "Hersteldatum", header: "Hersteldatum", width_mm: 31, align: left }
    - { field: "Schadenummer", header: "Schadenummer", width_mm: 50, align: left }
    - { field: "Aard werkzaamheden", header: "Aard werkzaamheden", width_mm: 70, align: left }
